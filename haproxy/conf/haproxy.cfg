###
# HAProxy main config
###

global
    # Use HTTPLOG format for structured HTTP logging
    log stdout format raw local0 info

    # Security Sandboxing
    chroot /var/lib/haproxy
    user haproxy
    group haproxy

    # Global process limits
    maxconn 4000
    tune.h2.initial-window-size 524288

    # Runtime API socket configuration
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 2m

    # Modern TLS Security Baseline
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11 no-tls-tickets
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

    # DNS settings for OCSP
    httpclient.resolvers.prefer ipv4

defaults
    mode                    http
    log                     global
    option                  httplog
    option                  dontlognull
    option                  http-keep-alive
    option                  redispatch
    option                  forwardfor
    http-reuse              safe
    retries                 3

    # Timeouts (Protect against slowloris & connection leaks)
    timeout connect         5s
    timeout server          60s
    timeout client          60s
    timeout http-request    10s
    timeout http-keep-alive 10s
    timeout queue           10s
    timeout tunnel          1h
    maxconn                 3000

# Authentication table for management
userlist controller
    # Generate hash using: haproxy -e "sha-512" -p "YourPassword"
    # Replace 'insecure-password' with 'password <hash>' in production
    user admin insecure-password ChangeMe!

resolvers container_dns
    parse-resolv-conf
    timeout retry           1s
    resolve_retries         3
    hold valid              10s

cache default_cache
    total-max-size          100   # MB
    max-object-size         10000 # bytes
    max-age                 30    # seconds

###
# Frontends
###

# HTTP to HTTPS Redirect
frontend http-in
    bind :80

    # Permanent 301 redirect to HTTPS preserving path and query string
    http-request redirect scheme https code 301 unless { ssl_fc }

# Main HTTPS Ingress
frontend https-in
    bind :443 ssl crt /etc/haproxy/certs alpn h2,http/1.1

    # Security Headers (Applied across all responses)
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    http-response set-header X-Content-Type-Options "nosniff"
    http-response set-header X-Frame-Options "SAMEORIGIN"
    http-response set-header Referrer-Policy "strict-origin-when-cross-origin"
    http-response set-header Content-Security-Policy "upgrade-insecure-requests"

    # Forwarding Headers (Sanitize & Normalize)
    http-request del-header X-Forwarded-For
    option forwardfor
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Port %[dst_port]

    # Dynamic HTTP Compression
    compression algo gzip
    compression type text/html text/plain text/css application/javascript application/json application/xml application/rss+xml application/atom+xml font/ttf font/otf font/eot font/woff font/woff2 image/svg+xml image/x-icon

    # Subdomain Routing Map
    use_backend ci       if { req.hdr(host) -i -m beg ci. }
    use_backend git      if { req.hdr(host) -i -m beg git. }
    use_backend grafana  if { req.hdr(host) -i -m beg graphs. }
    use_backend hoarder  if { req.hdr(host) -i -m beg hoarder. }
    use_backend home     if { req.hdr(host) -i -m beg home. }
    use_backend jellyfin if { req.hdr(host) -i -m beg jellyfin. }
    use_backend ollama   if { req.hdr(host) -i -m beg ollama. }
    use_backend tavern   if { req.hdr(host) -i -m beg tavern. }

    default_backend deny_404

# Internal Monitoring / Stats Page
frontend stats
    bind 127.0.0.1:8080
    # bind :8080 # Uncomment if exposed externally, but ensure auth is enabled!
    stats enable
    stats uri /
    stats refresh 10s
    stats show-node
    # Http-auth protection:
    # acl auth_ok httpauth(controller)
    # http-request auth realm "HAProxy Statistics" unless auth_ok

###
# Backends
###

# Default catch-all backend for unmapped hosts
backend deny_404
    mode http
    http-request return status 404 content-type "text/plain" lf-string "404 Not Found\n"
